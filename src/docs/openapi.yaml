  /crm/leads/upsert:
    post:
      operationId: upsertCRMLead
      summary: Criar ou atualizar card do pipeline (upsert)
      description: |
        Atualiza o card existente ou cria um novo. A resolucao do card segue
        esta ordem: `lead_id`/`id` informado, senao o card **aberto** do
        `contact_id` no workspace. Quando nenhum card e encontrado, um novo e
        criado (nesse caso `stage_id` e obrigatorio).

        Aceita `source` (origem), `channel` (canal), `utm_*`, `tags`, `note` e
        `segment`/`segment_id`.
      tags: [CRM Pipeline]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertCRMLead'
      responses:
        '200':
          description: Card atualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CRMLead'
        '201':
          description: Card criado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CRMLead'
        '400':
          description: Dados invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Nao autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /crm/leads/without-appointment:

    get:
      operationId: listCRMLeadsWithoutAppointment
      summary: Leads em uma etapa sem reuniao agendada
      description: |
        Retorna os leads de uma etapa do pipeline que **nao possuem reuniao
        agendada** (`crm_appointments` ativo). Aplica os mesmos filtros da UI
        do Pipeline (ver `include_incomplete_contacts` em `GET /crm/leads`).

        Se `stage_id` for omitido, o backend resolve automaticamente a etapa
        `MQL - Reuniao agendada` no workspace informado.

        Por padrao considera apenas reunioes futuras (`start_time >= now()`),
        ignorando agendamentos `cancelled`. Use `include_past=true` para
        considerar tambem reunioes passadas (qualquer agendamento nao
        cancelado serve como "tem reuniao").
      tags: [CRM Pipeline]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: stage_id
          in: query
          description: UUID da etapa. Se omitido, usa "MQL - Reuniao agendada".
          schema:
            type: string
            format: uuid
        - name: include_incomplete_contacts
          in: query
          description: Mesmo comportamento de `GET /crm/leads`.
          schema:
            type: boolean
            default: false
        - name: include_past
          in: query
          description: Quando true, considera tambem reunioes passadas (nao cancelladas) como "tem reuniao".
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Lista de leads sem reuniao agendada na etapa
          content:
            application/json:
              schema:
                type: object
                properties:
                  stage_id:
                    type: string
                    format: uuid
                  total_in_stage:
                    type: integer
                    description: Total de leads na etapa (apos filtros).
                  total_without_appointment:
                    type: integer
                    description: Total de leads sem reuniao agendada.
                  leads:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        title:
                          type: string
                        contact_id:
                          type: string
                          format: uuid
                        contact_name:
                          type: string
                        contact_phone:
                          type: string
                        contact_email:
                          type: string
                        value:
                          type: number
                        assigned_to:
                          type: string
                          format: uuid
                          nullable: true
                        moved_at:
                          type: string
                          format: date-time
                        created_at:
                          type: string
                          format: date-time
        '401':
          description: Nao autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Etapa nao encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

