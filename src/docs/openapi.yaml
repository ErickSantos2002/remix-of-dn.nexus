          type: string
          format: uuid
        assigned_to:
          type: string
          format: uuid
        description:
          type: string
        notes:
          type: string
        source:
          type: string
          description: >-
            Origem do lead. Validada contra as origens ATIVAS cadastradas em
            /settings/company > "Origens do Lead" (GET /crm/contact-sources).
            Valores fora da lista sao registrados como "Nao identificado"
            (com aviso em meta.warnings).
            Aplicada ao contato quando ele ainda nao possui origem.
        channel:
          type: string
          description: >-
            Canal do card (exibido como "Canal" no detalhe do lead). Alias de
            utm_source; se ambos forem enviados, utm_source prevalece.
        utm_source:
          type: string
        utm_medium:
          type: string
        utm_campaign:
          type: string
        utm_content:
          type: string
        utm_term:
          type: string
        tags:
          type: array
          description: >-
            Tags aplicadas ao contato do lead (max. 20 por requisicao, 50
            caracteres cada). Tags ja existentes sao ignoradas e retornadas em
            meta.tags_skipped.
          items:
            type: string
        note:
          type: string
          maxLength: 5000
          description: >-
            Nota registrada na timeline do card (aparece em "Notas e
            atualizacoes"). O id gerado retorna em meta.note_id.
        segment:
          type: string
          description: >-
            Segmento de mercado (nome ou UUID). Validado contra os segmentos
            ATIVOS de /settings/company > "Segmentos". Valores fora do
            catalogo caem no segmento marcado como "Padrao" (aviso em
            meta.warnings). O segmento aplicado retorna em meta.segment.
        segment_id:
          type: string
          format: uuid
          description: >-
            Id do segmento. Tem precedencia sobre `segment`.


    UpdateCRMLead:
      type: object
