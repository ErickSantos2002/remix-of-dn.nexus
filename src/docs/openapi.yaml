  /agent-calendars/slots:
    get:
      operationId: getAgentCalendarSlots
      summary: Grade de slots (livres e ocupados) por atendente
      description: |
        Retorna, por atendente, a grade de agenda do periodo: dias uteis, feriados,
        slots livres (respeitando `slot_step_minutes` do workspace, duracao padrao,
        intervalo minimo e agendamentos existentes) e blocos ocupados.
        Intervalo maximo: 62 dias. Considera apenas agendamentos internos (crm_appointments);
        bloqueios exclusivos do Google Calendar nao entram nesta grade.
      tags: [Agent Calendars]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: agent_id
          in: query
          schema: { type: string, format: uuid }
          description: 'Filtra um atendente especifico (padrao: todos com calendario configurado)'
        - name: start_date
          in: query
          schema: { type: string, format: date }
          description: 'Data inicial (YYYY-MM-DD). Padrao: hoje'
        - name: end_date
          in: query
          schema: { type: string, format: date }
          description: 'Data final (YYYY-MM-DD). Padrao: start_date + 6 dias'
        - name: duration
          in: query
          schema: { type: integer }
          description: 'Duracao desejada da reuniao em minutos (padrao: duracao padrao do calendario)'
        - name: include_past
          in: query
          schema: { type: boolean, default: false }
          description: Inclui slots ja passados no dia corrente
      responses:
        '200':
          description: Grade de slots por atendente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          period:
                            type: object
                            properties:
                              start_date: { type: string, format: date }
                              end_date: { type: string, format: date }
                          agents:
                            type: array
                            items:
                              type: object
                              properties:
                                agent_id: { type: string, format: uuid }
                                agent_name: { type: string, nullable: true }
                                timezone: { type: string }
                                work_days: { type: array, items: { type: string } }
                                work_start_time: { type: string }
                                work_end_time: { type: string }
                                slot_duration_minutes: { type: integer }
                                slot_step_minutes: { type: integer }
                                min_interval_minutes: { type: integer }
                                days:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      date: { type: string, format: date }
                                      weekday: { type: string }
                                      is_working_day: { type: boolean }
                                      is_holiday: { type: boolean }
                                      available_minutes: { type: integer }
                                      booked_minutes: { type: integer }
                                      free_slots:
                                        type: array
                                        items:
                                          type: object
                                          properties:
                                            start: { type: string, format: date-time }
                                            end: { type: string, format: date-time }
                                            time: { type: string }
                                      busy_slots:
                                        type: array
                                        items:
                                          type: object
                                          properties:
                                            start: { type: string, format: date-time }
                                            end: { type: string, format: date-time }
                                            appointment_id: { type: string, format: uuid, nullable: true }
                                            title: { type: string, nullable: true }
                                totals:
                                  type: object
                                  properties:
                                    capacity_minutes: { type: integer }
                                    booked_minutes: { type: integer }
                                    free_minutes: { type: integer }
                                    occupancy_rate: { type: number }
                                    total_slots: { type: integer }
                                    free_slots: { type: integer }
                                    booked_appointments: { type: integer }
        '400':
          description: Intervalo invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Nao autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /agent-calendars/capacity:
    get:
      operationId: getAgentCalendarCapacity
      summary: Taxa de ocupacao da agenda por atendente
      description: |
        Agrega capacidade (horas disponibilizadas nas janelas de trabalho, descontando
        feriados e dias nao uteis) contra ocupacao (horas de agendamentos ativos) e
        devolve a taxa de preenchimento por atendente e o total do workspace.
        Intervalo maximo: 186 dias.
      tags: [Agent Calendars]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: agent_id
          in: query
          schema: { type: string, format: uuid }
        - name: start_date
          in: query
          schema: { type: string, format: date }
        - name: end_date
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Capacidade e ocupacao
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          period:
                            type: object
                            properties:
                              start_date: { type: string, format: date }
                              end_date: { type: string, format: date }
                          totals:
                            type: object
                            properties:
                              capacity_minutes: { type: integer }
                              capacity_hours: { type: number }
                              booked_minutes: { type: integer }
                              booked_hours: { type: number }
                              free_minutes: { type: integer }
                              free_hours: { type: number }
                              occupancy_rate: { type: number }
                              agents: { type: integer }
                          agents:
                            type: array
                            items:
                              type: object
                              properties:
                                agent_id: { type: string, format: uuid }
                                agent_name: { type: string, nullable: true }
                                timezone: { type: string }
                                work_days: { type: array, items: { type: string } }
                                work_start_time: { type: string }
                                work_end_time: { type: string }
                                capacity_minutes: { type: integer }
                                capacity_hours: { type: number }
                                booked_minutes: { type: integer }
                                booked_hours: { type: number }
                                free_minutes: { type: integer }
                                free_hours: { type: number }
                                occupancy_rate: { type: number }
                                total_slots: { type: integer }
                                free_slots: { type: integer }
                                booked_appointments: { type: integer }
                                working_days: { type: integer }
        '400':
          description: Intervalo invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Nao autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


