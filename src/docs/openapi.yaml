        '401':
          description: Nao autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createCRMLead
      summary: Criar lead no CRM
      tags: [CRM Pipeline]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
