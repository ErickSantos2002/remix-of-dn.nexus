  /analytics/sales-cycle:
    get:
      operationId: getAnalyticsSalesCycle
      summary: Ciclo de compra (dias entre criacao do card e o ganho)
      description: |
        Retorna o tempo medio e mediano de fechamento dos cards ganhos (`status = won`) no periodo,
        calculado como a diferenca entre `crm_leads.created_at` e `crm_leads.closed_at`.
        Inclui distribuicao por faixas de dias, quebra por origem do contato e por canal (`utm_source`),
        e comparacao com o periodo imediatamente anterior de mesma duracao.
        Inclui tambem `by_month` - evolucao mes a mes dos ultimos 12 meses (won_count, avg_days, median_days),
        independente do periodo informado, para leitura de tendencia.
      tags: [Analytics]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: start_date
          in: query
          description: Inicio do periodo (filtra por closed_at). Padrao - 30 dias atras.
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          description: Fim do periodo (filtra por closed_at). Padrao - agora.
          schema:
            type: string
            format: date-time
        - name: source
          in: query
          description: Filtra pela origem do contato (crm_contacts.source), case-insensitive.
          schema:
            type: string
        - name: utm_source
          in: query
          description: Filtra pelo canal do card (alias - channel).
          schema:
            type: string
        - name: channel
          in: query
          description: Alias de utm_source.
          schema:
            type: string
        - name: compare
          in: query
          description: Quando false, nao calcula o periodo anterior.
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Metricas de ciclo de compra
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SalesCycle'
        '401':
          description: Nao autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

