            type: string
            format: uuid
        - name: product_id
          in: query
          schema:
            type: string
            format: uuid
        - name: tags
          in: query
          schema:
            type: string
        - name: source
          in: query
          description: Filtra pela origem do contato vinculado (crm_contacts.source).
          schema:
            type: string
        - name: utm_source
          in: query
          description: Filtra pelo UTM Source do card. Alias aceito&#58; `channel`.
          schema:
            type: string
        - name: channel
          in: query
          description: Alias de `utm_source` (campo exibido como "Canal" no card).
          schema:
            type: string
        - name: utm_medium
          in: query
          schema:
            type: string
        - name: utm_campaign
          in: query
          schema:
            type: string

        - name: include_incomplete_contacts
          in: query
          description: |
            Quando `false` (padrao), aplica os mesmos filtros da UI do Pipeline:
            exclui leads cujo contato esteja sem nome ou com nome generico
            (Visitante Widget, Visitante, Contato, Anonimo, Lead) e sem
            email/telefone. Use `true` para receber todos os leads da etapa,
            ignorando esses filtros de qualidade de contato.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
