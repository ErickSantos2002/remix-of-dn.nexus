        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Log de automove
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '401':
          description: Nao autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ════════════════════════════════════════════════════════════════
  # 14b. CRM Activities (meetings, demos, calls)
  # ════════════════════════════════════════════════════════════════
  /crm/activities:
    get:
      operationId: listCRMActivities
      summary: Listar atividades do CRM
      description: Lista atividades (reunioes, demos, calls, etc.) com filtros por tipo, status e periodo. Suporta paginacao.
      tags: [CRM Activities]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: type
          in: query
          schema: { type: string, enum: [meeting, demo, call, reschedule, task, note, email, whatsapp] }
        - name: status
          in: query
          schema: { type: string, enum: [scheduled, completed, no_show, cancelled, pending, rescheduled] }
        - name: start_date
          in: query
          schema: { type: string, format: date-time }
          description: Filtro por scheduled_at >= start_date (ISO 8601)
        - name: end_date
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Lista paginada de atividades
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'

  /crm/activities/stats:
    get:
      operationId: getCRMActivitiesStats
      summary: Estatisticas de reunioes (paridade com Analytics interno)
      description: |
        Retorna estatisticas agregadas de atividades do tipo `meeting`, `demo` e `reschedule`,
        replicando 100% a logica do Analytics interno (baseada em `crm_lead_activities.status`).
        Inclui drill-down via `lead_ids` e `activity_ids`.
      tags: [CRM Activities]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: start_date
          in: query
          schema: { type: string, format: date-time }
        - name: end_date
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Estatisticas + IDs para drill-down
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          period:
                            type: object
                            properties:
                              start_date: { type: string, format: date-time }
                              end_date: { type: string, format: date-time }
                          meetings:
                            type: object
                            properties:
                              scheduled: { type: integer }
                              completed: { type: integer }
                              no_show: { type: integer, description: Status manual marcado pelo agente }
                              cancelled: { type: integer }
                              pending: { type: integer }
                              rescheduled: { type: integer }
                              no_show_rate: { type: number }
                              completion_rate: { type: number }
                              reschedule_rate: { type: number }
                          breakdown_by_type:
                            type: object
                            additionalProperties: { type: integer }
                          lead_ids:
                            type: object
                            additionalProperties:
                              type: array
                              items: { type: string, format: uuid }
                          activity_ids:
                            type: object
                            additionalProperties:
                              type: array
                              items: { type: string, format: uuid }

  # ════════════════════════════════════════════════════════════════
  # 14c. CRM Funnel
  # ════════════════════════════════════════════════════════════════
  /crm/performance/ranking:
    get:
      operationId: getCRMPerformanceRanking
      summary: Ranking de desempenho dos vendedores no atendimento
      description: |
        Ranking dos vendedores pelo score medio das avaliacoes de atendimento
        (reunioes, demonstracoes e ligacoes avaliadas contra um playbook).

        - **avg_score**: media 0-100 das avaliacoes concluidas no periodo
        - **trend**: media da segunda metade do periodo menos a da primeira, em PONTOS de score
        - **recurrent_points**: pontos de desenvolvimento com status `recurrent` (falhas repetidas)

        Reincidencia NAO reduz o score: ela e reportada a parte para manter as notas
        comparaveis entre vendedores e ao longo do tempo.

        Somente atendimentos com `status=done`, score preenchido e nao desconsiderados
        pelo gestor entram no calculo.
      tags: [CRM Performance]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: period
          in: query
          schema: { type: string, enum: [today, 7d, 30d, 90d], default: 30d }
          description: Ignorado quando `start_date` e informado
        - name: start_date
          in: query
          schema: { type: string, format: date-time }
        - name: end_date
          in: query
          schema: { type: string, format: date-time }
          description: Default = agora
        - name: analysis_id
          in: query
          schema: { type: string, format: uuid }
          description: Filtra por um tipo de analise (playbook) especifico
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Ranking ordenado por score medio (maior primeiro)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            seller_id: { type: string, format: uuid }
                            seller_name: { type: string, example: "Maria Silva", description: "Nome registrado no momento da avaliacao" }
                            avg_score: { type: integer, minimum: 0, maximum: 100, example: 78 }
                            analyses_count: { type: integer, example: 12 }
                            trend: { type: integer, example: 5, description: "Variacao em pontos de score" }
                            recurrent_points: { type: integer, example: 2 }
                      meta:
                        type: object
                        properties:
                          total: { type: integer }
                          page: { type: integer }
                          per_page: { type: integer }
                          period:
                            type: object
                            properties:
                              start: { type: string, format: date-time }
                              end: { type: string, format: date-time }
        '400':
          description: start_date ou end_date invalidos
        '404':
          description: Sub-rota desconhecida em /crm/performance

  /crm/performance/overview:
    get:
      operationId: getCRMPerformanceOverview
      summary: Visao geral do desempenho da equipe
      description: |
        Mesmos numeros da aba "Visao geral" de /crm/desempenho, no escopo da EMPRESA
        dona do workspace informado.

        - **company_average**: media 0-100 das avaliacoes concluidas no periodo (null se nao houver)
        - **trend**: media da segunda metade do periodo menos a da primeira, em PONTOS
        - **by_playbook**: media e volume por tipo de analise
        - **score_series**: media diaria (yyyy-MM-dd), em ordem cronologica
        - **ranking**: mesma estrutura de /crm/performance/ranking, sem paginacao

        Avaliacoes desconsideradas pelo gestor ficam fora de todos os calculos.
      tags: [CRM Performance]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: period
          in: query
          schema: { type: string, enum: [today, 7d, 30d, 90d], default: 30d }
        - name: start_date
          in: query
          schema: { type: string, format: date-time }
        - name: end_date
          in: query
          schema: { type: string, format: date-time }
        - name: playbook_id
          in: query
          schema: { type: string, format: uuid }
          description: Filtra por um tipo de analise (alias, `analysis_id`)
      responses:
        '200':
          description: Agregados do periodo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          company_average: { type: integer, nullable: true, example: 74 }
                          total_analyses: { type: integer, example: 38 }
                          trend: { type: integer, example: 3 }
                          by_playbook:
                            type: array
                            items:
                              type: object
                              properties:
                                playbook_id: { type: string, format: uuid }
                                name: { type: string }
                                avg_score: { type: integer }
                                count: { type: integer }
                          score_series:
                            type: array
                            items:
                              type: object
                              properties:
                                date: { type: string, example: "2026-08-13" }
                                score: { type: integer }
                                count: { type: integer }
                          ranking:
                            type: array
                            items:
                              type: object
                              properties:
                                seller_id: { type: string, format: uuid }
                                seller_name: { type: string }
                                avg_score: { type: integer }
                                analyses_count: { type: integer }
                                trend: { type: integer }
                                recurrent_points: { type: integer }
        '400':
          description: start_date ou end_date invalidos
        '404':
          description: Empresa nao encontrada para o workspace

  /crm/performance/analyses:
    get:
      operationId: listCRMPerformanceAnalyses
      summary: Lista as avaliacoes de atendimento do periodo
      description: |
        Historico das avaliacoes do workspace, ordenado do atendimento mais recente
        para o mais antigo (`occurred_at` = quando o atendimento aconteceu, nao
        quando a IA avaliou).

        Avaliacoes desconsideradas pelo gestor ficam de fora por padrao; use
        `include_disregarded=true` para audita-las.
      tags: [CRM Performance]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: period
          in: query
          schema: { type: string, enum: [today, 7d, 30d, 90d], default: 30d }
        - name: start_date
          in: query
          schema: { type: string, format: date-time }
        - name: end_date
          in: query
          schema: { type: string, format: date-time }
        - name: seller_id
          in: query
          schema: { type: string, format: uuid }
        - name: playbook_id
          in: query
          schema: { type: string, format: uuid }
        - name: lead_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [processing, done, failed] }
        - name: include_disregarded
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Lista paginada de avaliacoes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AnalysisResultSummary' }
        '400':
          description: start_date ou end_date invalidos

  /crm/performance/analyses/{id}:
    get:
      operationId: getCRMPerformanceAnalysis
      summary: Detalhe completo de uma avaliacao
      description: |
        Retorna a avaliacao inteira: veredicto e evidencia por criterio, pontos fortes,
        melhorias sugeridas, habitos observados, reincidencias e correcoes.

        `evidence_verified=false` indica que o trecho citado nao foi localizado na
        transcricao (a IA parafraseou) — o veredicto continua valido, a evidencia nao
        serve como prova.
      tags: [CRM Performance]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Avaliacao completa
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AnalysisResult' }
        '404':
          description: Avaliacao nao encontrada neste workspace

  /crm/performance/sellers/{sellerId}:
    get:
      operationId: getCRMPerformanceSeller
      summary: Painel de desempenho de um vendedor
      description: |
        Espelha o painel individual: media, tendencia, serie diaria de score, pontos de
        desenvolvimento (abertos, recorrentes e corrigidos no periodo) e conquistas.

        Um ponto corrigido pertence ao periodo da CORRECAO; abertos e recorrentes, ao
        periodo da ultima ocorrencia.
      tags: [CRM Performance]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: sellerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: period
          in: query
          schema: { type: string, enum: [today, 7d, 30d, 90d], default: 30d }
        - name: start_date
          in: query
          schema: { type: string, format: date-time }
        - name: end_date
          in: query
          schema: { type: string, format: date-time }
        - name: playbook_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Painel do vendedor
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          seller_id: { type: string, format: uuid }
                          seller_name: { type: string, nullable: true }
                          average_score: { type: integer, nullable: true }
                          trend: { type: integer }
                          analyses_count: { type: integer }
                          disregarded_count: { type: integer }
                          score_series:
                            type: array
                            items:
                              type: object
                              properties:
                                date: { type: string }
                                score: { type: integer }
                                count: { type: integer }
                          open_points:
                            type: array
                            items: { $ref: '#/components/schemas/SellerDevelopmentPoint' }
                          recurrent_points:
                            type: array
                            items: { $ref: '#/components/schemas/SellerDevelopmentPoint' }
                          corrected_points:
                            type: array
                            items: { $ref: '#/components/schemas/SellerDevelopmentPoint' }
                          achievements:
                            type: array
                            items:
                              type: object
                              properties:
                                achievement_key: { type: string }
                                earned_at: { type: string, format: date-time }
                                meta: { type: object, additionalProperties: true }
        '404':
          description: Empresa nao encontrada para o workspace

  /crm/performance/sellers/{sellerId}/development-points:
    get:
      operationId: listCRMPerformanceSellerPoints
      summary: Pontos de desenvolvimento do vendedor
      description: |
        Todos os pontos rastreados do vendedor, sem recorte de periodo.

        - `open`: apontado uma vez e ainda nao corrigido
        - `recurrent`: voltou a ocorrer apos ja ter sido apontado
        - `corrected`: atendido em uma avaliacao posterior
      tags: [CRM Performance]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: sellerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [open, recurrent, corrected] }
      responses:
        '200':
          description: Pontos ordenados pela ultima ocorrencia
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SellerDevelopmentPoint' }

  /crm/performance/sellers/{sellerId}/brief:
    get:
      operationId: getCRMPerformanceSellerBrief
      summary: Orientacao de coaching do vendedor
      description: |
        Ultimo brief de coaching gerado para o vendedor (material de gestao, em Markdown).
        Retorna 404 quando nenhuma orientacao foi gerada ainda — a geracao acontece
        sob demanda pelo gestor na tela de desempenho.
      tags: [CRM Performance]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: sellerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Brief mais recente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          seller_id: { type: string, format: uuid }
                          brief_md: { type: string }
                          model: { type: string, nullable: true }
                          generated_at: { type: string, format: date-time }
        '404':
          description: Nenhuma orientacao gerada para este vendedor

  /crm/performance/playbooks:
    get:
      operationId: listCRMPerformancePlaybooks
      summary: Analises (playbooks) cadastradas na empresa
      description: |
        Catalogo dos tipos de analise usados para avaliar atendimentos. Use o `id`
        retornado aqui como `playbook_id` nos demais endpoints de desempenho.
      tags: [CRM Performance]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Lista de analises da empresa
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AnalysisPlaybook' }

  /crm/performance/playbooks/{id}:
    get:
      operationId: getCRMPerformancePlaybook
      summary: Analise com a rubrica ativa e seus criterios
      description: |
        Alem dos dados da analise, retorna a versao ATIVA da rubrica e os criterios
        avaliados (com peso). O score e a soma ponderada dos veredictos calculada em
        codigo — nunca pelo modelo.
      tags: [CRM Performance]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Analise + rubrica ativa
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/AnalysisPlaybook'
                          - type: object
                            properties:
                              guidelines: { type: string, nullable: true }
                              rubric_version:
                                type: object
                                nullable: true
                                properties:
                                  id: { type: string, format: uuid }
                                  version: { type: integer }
                                  status: { type: string, enum: [draft, active, superseded] }
                                  created_at: { type: string, format: date-time }
                              criteria:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    criterion_key: { type: string }
                                    stage: { type: string, nullable: true }
                                    name: { type: string }
                                    description: { type: string, nullable: true }
                                    weight: { type: number }
                                    sort_order: { type: integer }
                                    is_active: { type: boolean }
        '404':
          description: Analise nao encontrada nesta empresa



  /crm/funnel/stats:
    get:
      operationId: getCRMFunnelStats
      summary: Estatisticas do funil (paridade com Analytics interno)
      description: |
        Retorna o funil completo replicando 100% a logica usada no Analytics interno do Nexus
        (componentes `useCRMAnalytics` + `FunnelStageLeadsDialog`).

        Para cada etapa retorna:
        - **current_count**: snapshot atual de leads `status=open` no estagio
        - **period_count**: leads que ENTRARAM no estagio durante [start_date, end_date) via `crm_lead_history.to_stage_id`
        - **current_lead_ids / period_lead_ids**: drill-down qualitativo

        Tambem retorna `won` / `lost` agregados a partir de `crm_lead_history.action`
        (`won|marked_won|closed_won` e `lost|marked_lost|closed_lost`) com fallback para
        `crm_leads.status` + `closed_at` — cards fechados sem registro no historico entram
        no agregado do mesmo jeito. Retorna ainda a taxa de conversao entre etapas adjacentes.

        **NAO use mais `/crm/leads` paginado para montar o funil** — esse metodo ignora paginacao
        >1000, leads `won/lost` parados em estagios intermediarios, e a metrica de periodo (PROJ).
      tags: [CRM Funnel]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: start_date
          in: query
          schema: { type: string, format: date-time }
          description: Default = ultimos 30 dias
        - name: end_date
          in: query
          schema: { type: string, format: date-time }
          description: Default = agora
        - name: assigned_to
          in: query
          schema: { type: string, format: uuid }
          description: |
            Recorta o funil por dono atual do card (`crm_leads.assigned_to`). Alias: `seller_id`.
            Ausente = agregado do workspace. Para comparar todos os vendedores de uma vez use
            `GET /analytics/funnel-by-seller`.
        - name: include_ids
          in: query
          schema: { type: boolean, default: true }
          description: Se `false`, omite arrays de IDs para resposta menor
      responses:
        '200':
          description: Funil agregado com drill-down por etapa
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          period:
                            type: object
                            properties:
                              start_date: { type: string, format: date-time }
                              end_date: { type: string, format: date-time }
                          stages:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: string, format: uuid }
                                name: { type: string, example: "Lead Qualificado" }
                                color: { type: string, nullable: true }
                                order: { type: integer }
                                position: { type: integer }
                                is_default: { type: boolean }
                                current_count: { type: integer, description: "Numero grande exibido (snapshot atual)" }
                                period_count: { type: integer, description: "PROJ N — leads que entraram no estagio no periodo" }
                                current_lead_ids:
                                  type: array
                                  items: { type: string, format: uuid }
                                period_lead_ids:
                                  type: array
                                  items: { type: string, format: uuid }
                          won:
                            type: object
                            properties:
                              count: { type: integer }
                              lead_ids: { type: array, items: { type: string, format: uuid } }
                          lost:
                            type: object
                            properties:
                              count: { type: integer }
                              lead_ids: { type: array, items: { type: string, format: uuid } }
                          conversions:
                            type: array
                            description: Conversao entre etapas adjacentes (com base em period_count)
                            items:
                              type: object
                              properties:
                                from_stage_id: { type: string, format: uuid }
                                from_stage_name: { type: string }
                                to_stage_id: { type: string, format: uuid }
                                to_stage_name: { type: string }
                                rate: { type: number, description: "Percentual (ex: 11.6 = 11.6%)" }

  # ════════════════════════════════════════════════════════════════
  # 15. Appointments
  # ════════════════════════════════════════════════════════════════
  /appointments:
    get:
      operationId: listAppointments
      summary: Listar agendamentos
      tags: [Appointments]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: status
          in: query
          description: Filtra pelo status bruto do agendamento (ex. scheduled, cancelled)
          schema:
            type: string
        - name: agent_id
          in: query
          description: Filtra pelo responsavel (assigned_to)
          schema:
            type: string
            format: uuid
        - name: start_date
          in: query
          description: Data/hora minima de inicio (start_time >= valor), ISO 8601
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          description: Data/hora maxima de fim (end_time <= valor), ISO 8601
          schema:
            type: string
            format: date-time
        - name: derived_status
          in: query
          description: Filtra pelo status derivado calculado pela API
          schema:
