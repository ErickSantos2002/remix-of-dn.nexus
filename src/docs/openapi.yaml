openapi: 3.0.3
info:
  title: Nexus AI API
  version: 1.0.0
  x-last-updated: '2026-08-14T00:33:00-03:00'
  description: |
    _Documentacao atualizada em 14/08/2026 00:33 (Brasilia)




    API da plataforma Nexus AI — sistema multi-tenant de atendimento ao cliente com agentes inteligentes,
    CRM, integracao WhatsApp e gestao de conhecimento.

    ## Autenticacao

    A API suporta dois metodos de autenticacao:

    - **JWT (Bearer Token)**: Obtido via `POST /auth/login`. Enviar no header `Authorization: Bearer {token}`.
    - **API Key**: Criada em `/settings/api-keys`. Enviar no header `X-API-Key: {chave}`.

    ## Fluxo de autenticacao

    1. `POST /auth/login` com email e password → recebe `token` (JWT)
    2. `GET /companies` com Bearer token → lista empresas do usuario → pega `company_id`
    3. `GET /workspaces?company_id={id}` → lista workspaces → pega o `id` desejado
    4. Usar `X-Workspace-Id: {workspace_id}` nos endpoints que exigem workspace

    ## Header X-Workspace-Id

    Endpoints que operam dentro de um workspace exigem o header `X-Workspace-Id` (UUID).

    **NAO exigem** X-Workspace-Id:
    - Auth (`/auth/*`)
    - Companies (`/companies/*`)
    - Workspaces (`/workspaces/*`)
    - Connections (`/connections/*`)
    - Invites (`/invites/*`)
    - Notifications (`/notifications/*`)
    - Admin (`/admin/*`)
    - Agent Templates (`/agent-templates/*`)
    - Public (`/public/*`)
    - Webhooks (`/webhooks/*`)

    **Exigem** X-Workspace-Id:
    - Agents, Agent Categories, Inbox, CRM (contacts, pipeline, psychology, products, loss-reasons, tags, automove),
      Appointments, Agent Calendars, Knowledge Base, Messages, Routing, Chat Categories,
      Availability, Analytics, Tools, Widgets, API Keys, Integrations

    ## Agenda e disponibilidade do vendedor

    Existem tres blocos complementares para tudo que envolve agenda:

    **1. Agendamentos (`/appointments`)** — reunioes propriamente ditas.
    - `GET /appointments` — lista com filtros de `status`, `agent_id` (responsavel), `start_date`, `end_date` e `derived_status`
      (`realized`, `no_show`, `cancelled`, `upcoming`, `scheduled`)
    - `POST /appointments` — cria a reuniao (titulo, `start_time`, `end_time`, participantes, `lead_id`, `agent_id`)
    - `GET /appointments/{id}` — detalhes | `PUT /appointments/{id}` — atualiza | `DELETE /appointments/{id}` — cancela
    - `POST /appointments/{id}/attendees` — adiciona participante
    - `GET /appointments/availability` — horarios livres (slots) de um responsavel em uma data
    - `POST /appointments/{id}/sync-calendar` — sincroniza com o Google Calendar

    Datas relevantes: `created_at` do agendamento e **quando a reuniao foi marcada**; `start_time` e **para quando ela foi marcada**.

    **2. Disponibilidade operacional (`/availability`)** — se o vendedor esta apto a receber leads agora.
    - `GET /availability` — disponibilidade do usuario autenticado
    - `PUT /availability` — atualiza `status`, `is_accepting_leads` e `max_concurrent_leads`
    - `GET /availability/{userId}` — disponibilidade de um usuario especifico

    Esses campos alimentam o roteamento de leads (`/routing`): um atendente com `is_accepting_leads = false`
    ou que atingiu o `max_concurrent_leads` deixa de ser elegivel nas estrategias de distribuicao.

    **3. Janelas de trabalho (`/agent-calendars`)** — horarios, intervalos e fuso de cada atendente,
    usados como base para calcular os slots retornados em `GET /appointments/availability`.
    O tamanho do slot (passo entre horarios candidatos) e uma configuracao geral do workspace
    definida em `/crm/settings/agent-calendars`; feriados sao respeitados tanto no widget publico
    quanto no agendamento feito pela IA.

  contact:
    name: Nexus AI
    url: https://nexus-ai-schema.lovable.app
  license:
    name: Proprietary

servers:
  - url: https://nexus-ai-schema.lovable.app/api/v1
    description: Producao
  - url: http://localhost:8080/api/v1
    description: Desenvolvimento

security:
  - BearerAuth: []

tags:
  - name: Auth
    description: Autenticacao e perfil do usuario. Nao exige X-Workspace-Id. Login e register sao publicos.
  - name: Companies
    description: Gestao de empresas e membros. Nao exige X-Workspace-Id.
  - name: Workspaces
    description: Gestao de workspaces. Nao exige X-Workspace-Id.
  - name: Agents
    description: Agentes de IA. Exige X-Workspace-Id.
  - name: Agent Categories
    description: Categorias de agentes. Exige X-Workspace-Id.
  - name: Agent Templates
    description: Templates de agentes. Nao exige X-Workspace-Id. Requer super_admin.
  - name: Inbox
    description: Caixa de entrada e gestao de leads. Exige X-Workspace-Id.
  - name: CRM Contacts
    description: Contatos do CRM. Exige X-Workspace-Id.
  - name: CRM Pipeline
    description: Pipeline e leads do CRM. Exige X-Workspace-Id.
  - name: CRM Psychology
    description: Analise psicologica DNIA de leads. Exige X-Workspace-Id.
  - name: CRM Products
    description: Produtos do CRM. Exige X-Workspace-Id.
  - name: CRM Loss Reasons
    description: Motivos de perda. Exige X-Workspace-Id.
  - name: CRM Tags
    description: Tags de contatos. Exige X-Workspace-Id.
  - name: CRM Automove
    description: Regras de movimentacao automatica. Exige X-Workspace-Id.
  - name: CRM Activities
    description: Atividades do CRM (reunioes, demos, calls) com estatisticas. Exige X-Workspace-Id.
  - name: CRM Funnel
    description: Estatisticas do funil de vendas com paridade ao Analytics interno. Exige X-Workspace-Id.
  - name: Appointments
    description: >-
      Agendamentos (reunioes) e consulta de horarios livres do responsavel via
      GET /appointments/availability. created_at = quando a reuniao foi marcada;
      start_time = para quando ela foi marcada. Exige X-Workspace-Id.
  - name: Google Calendar
    description: Integracao Google Calendar. Exige X-Workspace-Id.
  - name: Agent Calendars
    description: >-
      Calendarios dos atendentes (horarios de trabalho, intervalos e fuso). Base de calculo dos
      slots retornados em GET /appointments/availability. Exige X-Workspace-Id.
  - name: Knowledge Base
    description: Base de conhecimento e documentos. Exige X-Workspace-Id.
  - name: Connections
    description: Conexoes de canais. Nao exige X-Workspace-Id (filtra por workspace quando fornecido).
  - name: Z-API
    description: Integracao Z-API (WhatsApp nao-oficial). Nao exige X-Workspace-Id.
  - name: WhatsApp Official
    description: Integracao WhatsApp oficial. Nao exige X-Workspace-Id.
  - name: Messaging
    description: Envio de mensagens. Exige X-Workspace-Id.
  - name: Routing
    description: Roteamento de leads. Exige X-Workspace-Id.
  - name: Chat Categories
    description: Categorias de chat. Exige X-Workspace-Id.
  - name: Availability
    description: >-
      Disponibilidade operacional do atendente/vendedor (status, se esta aceitando leads e
      limite de leads simultaneos). Alimenta as estrategias de roteamento. Exige X-Workspace-Id.
  - name: Notifications
    description: Notificacoes do usuario. Nao exige X-Workspace-Id.
  - name: Analytics
    description: Relatorios e metricas. Exige X-Workspace-Id.
  - name: Tools
    description: Catalogo de ferramentas. Exige X-Workspace-Id.
  - name: Widgets
    description: Widgets de chat. Exige X-Workspace-Id.
  - name: Webhooks
    description: Webhooks de canais. Nao exige autenticacao.
  - name: Internal
    description: Endpoints internos do sistema. Requer autenticacao de servico.
  - name: API Keys
    description: Chaves de API. Exige X-Workspace-Id.
  - name: Admin
    description: Painel administrativo. Nao exige X-Workspace-Id. Requer super_admin.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    WorkspaceId:
      name: X-Workspace-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: ID do workspace ativo
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
      description: Pagina atual
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        default: 50
      description: Itens por pagina
    Search:
      name: search
      in: query
      schema:
        type: string
      description: Termo de busca
    Sort:
      name: sort
      in: query
      schema:
        type: string
      description: Campo de ordenacao
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
      description: Direcao da ordenacao

  schemas:
    SalesCycleBreakdown:
      type: object
      properties:
        key:
          type: string
          description: Origem do contato ou canal (utm_source). Valores vazios viram nao_identificado / sem_canal.
        won_count:
          type: integer
        avg_days:
          type: number
          nullable: true
        median_days:
          type: number
          nullable: true

    SalesCycle:
      type: object
      properties:
        period:
          type: object
          properties:
            start_date:
              type: string
            end_date:
              type: string
        won_count:
          type: integer
          description: Cards ganhos com closed_at dentro do periodo.
        avg_days:
          type: number
          nullable: true
          description: Ciclo medio em dias (created_at ate closed_at).
        median_days:
          type: number
          nullable: true
        min_days:
          type: number
          nullable: true
        max_days:
          type: number
          nullable: true
        p90_days:
          type: number
          nullable: true
          description: 90% das vendas fecham em ate N dias.
        total_value:
          type: number
          description: Soma do valor dos cards ganhos no periodo.
        previous_period:
          type: object
          nullable: true
          properties:
            start_date:
              type: string
            end_date:
              type: string
            won_count:
              type: integer
            avg_days:
              type: number
              nullable: true
            median_days:
              type: number
              nullable: true
        distribution:
          type: array
          items:
            type: object
            properties:
              bucket_days:
                type: string
                enum: ['0-1', '2-7', '8-15', '16-30', '31-60', '60+']
              count:
                type: integer
        by_source:
          type: array
          items:
            $ref: '#/components/schemas/SalesCycleBreakdown'
        by_channel:
          type: array
          items:
            $ref: '#/components/schemas/SalesCycleBreakdown'

    # ── CRM Performance (avaliacao de atendimento) ──────────────
    AnalysisPlaybook:
      type: object
      description: Tipo de analise cadastrado na empresa (playbook + rubrica + diretriz)
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Reuniao de diagnostico" }
        description: { type: string, nullable: true }
        activity_types:
          type: array
          items: { type: string, enum: [meeting, demo, phone_call] }
        status: { type: string, enum: [draft, active, archived] }
        is_default: { type: boolean, description: "Pre-selecionada no primeiro atendimento de cada tipo" }
        ai_model: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SellerDevelopmentPoint:
      type: object
      description: Ponto de desenvolvimento rastreado entre avaliacoes
      properties:
        id: { type: string, format: uuid }
        seller_id: { type: string, format: uuid }
        point_type: { type: string, enum: [criterion, habit] }
        point_key: { type: string }
        label: { type: string, nullable: true }
        playbook_id: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [open, recurrent, corrected] }
        occurrences: { type: integer }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        corrected_at: { type: string, format: date-time, nullable: true }

    AnalysisResultSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        activity_id: { type: string, format: uuid, nullable: true }
        lead_id: { type: string, format: uuid, nullable: true }
        seller_id: { type: string, format: uuid, nullable: true }
        seller_name: { type: string, nullable: true, description: "Snapshot do nome no momento da avaliacao" }
        playbook_id: { type: string, format: uuid, nullable: true }
        source_type: { type: string, enum: [daily_recording, call, meeting_chunks] }
        score: { type: integer, nullable: true, minimum: 0, maximum: 100 }
        status: { type: string, enum: [processing, done, failed] }
        summary_md: { type: string, nullable: true }
        occurred_at: { type: string, format: date-time, description: "Quando o atendimento aconteceu" }
        created_at: { type: string, format: date-time, description: "Quando a IA avaliou" }
        disregarded_at: { type: string, format: date-time, nullable: true }
        model: { type: string, nullable: true }

    AnalysisResult:
      allOf:
        - $ref: '#/components/schemas/AnalysisResultSummary'
        - type: object
          properties:
            workspace_id: { type: string, format: uuid }
            company_id: { type: string, format: uuid }
            rubric_version_id: { type: string, format: uuid, nullable: true }
            error_message: { type: string, nullable: true }
            criteria_results:
              type: array
              items:
                type: object
                properties:
                  criterion_key: { type: string }
                  name: { type: string }
                  stage: { type: string, nullable: true }
                  weight: { type: number }
                  verdict: { type: string, enum: [met, partial, missed, not_applicable] }
                  evidence: { type: string, description: "Citacao literal da transcricao" }
                  evidence_verified: { type: boolean }
                  feedback: { type: string }
            strengths:
              type: array
              items:
                type: object
                properties:
                  title: { type: string }
                  evidence: { type: string }
                  evidence_verified: { type: boolean }
            improvements:
              type: array
              items:
                type: object
                properties:
                  criterion_key: { type: string, nullable: true }
                  title: { type: string }
                  suggestion: { type: string }
            habits:
              type: array
              items:
                type: object
                properties:
                  habit_key: { type: string }
                  observed: { type: string, enum: [positive, negative] }
                  evidence: { type: string }
            recurrences:
              type: array
              items:
                type: object
                properties:
                  point_type: { type: string, enum: [criterion, habit] }
                  point_key: { type: string }
                  label: { type: string }
                  occurrences: { type: integer }
                  first_seen_at: { type: string, format: date-time }
            corrected:
              type: array
              items:
                type: object
                properties:
                  point_type: { type: string, enum: [criterion, habit] }
                  point_key: { type: string }
                  label: { type: string }
                  occurrences: { type: integer }

    # ── Common Responses ────────────────────────────────────────
    SuccessResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object

    PaginatedResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: array
          items:
            type: object
        meta:
          type: object
          required: [page, per_page, total]
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object

    # ── Entities ────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        availability_status:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        owner_id:
          type: string
          format: uuid
          nullable: true
        zapi_token_status:
          type: string
          nullable: true
        zapi_token_validated_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    CompanyMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, admin, member]
        status:
          type: string
          enum: [active, inactive]
        joined_at:
          type: string
          format: date-time
        profiles:
          $ref: '#/components/schemas/User'

    CompanyInvite:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
        status:
          type: string
          enum: [pending, accepted, cancelled, expired]
        invitee_name:
          type: string
          nullable: true
        invitee_phone:
          type: string
          nullable: true
        workspace_ids:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        is_default:
          type: boolean
          nullable: true
        owner_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time

    WorkspaceMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [admin, member]
        status:
          type: string
          enum: [active, inactive]
        joined_at:
          type: string
          format: date-time
        profiles:
          $ref: '#/components/schemas/User'

    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        system_prompt:
          type: string
        tone:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        category_id:
          type: string
          format: uuid
          nullable: true
        is_active:
          type: boolean
        is_archived:
          type: boolean
        keywords:
          type: array
          items:
            type: string
          nullable: true
        icon:
          type: string
          nullable: true
        split_messages:
          type: boolean
        activation_description:
          type: string
          nullable: true
        knowledge_base_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AgentCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        is_active:
          type: boolean
        is_system:
          type: boolean

    AgentTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        system_prompt:
          type: string
        tone:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    Lead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        status:
          type: string
          enum: [new, ai_talking, needs_human, human_talking, closed]
        assigned_agent_id:
          type: string
          format: uuid
          nullable: true
        assigned_human_id:
          type: string
          format: uuid
          nullable: true
        source:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
          nullable: true
        sentiment:
          type: string
          nullable: true
        intent:
          type: string
          nullable: true
        urgency:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lead_id:
          type: string
          format: uuid
        content:
          type: string
          nullable: true
        sender_type:
          type: string
          enum: [lead, agent, human, system]
        sender_name:
          type: string
          nullable: true
        media_type:
          type: string
          nullable: true
        media_url:
          type: string
          format: uri
          nullable: true
        external_message_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    CRMContact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
          nullable: true
        source:
          type: string
          nullable: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/ContactTag'
          nullable: true
        notes:
          type: string
          nullable: true
        is_opted_out:
          type: boolean
        dnia_id:
          type: string
          format: uuid
          nullable: true
          description: ID universal do contato no dnMarketing
        created_at:
          type: string
          format: date-time

    ContactTag:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
        color:
          type: string

    CRMPipelineStage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: integer
        color:
          type: string
          nullable: true
        is_default:
          type: boolean
        is_won:
          type: boolean
        is_lost:
