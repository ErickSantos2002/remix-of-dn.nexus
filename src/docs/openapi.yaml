                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Sem permissao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Empresa nao encontrada
          content:
            application/json:
              schema:
