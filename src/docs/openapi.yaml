            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateCRMLeadUtm
      summary: Atualizar somente UTMs/canal do lead
      description: Atualiza apenas os campos de UTM enviados, sem precisar reenviar o card completo.
