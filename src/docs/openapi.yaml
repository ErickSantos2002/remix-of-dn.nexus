  /analytics/funnel-by-seller:
    get:
      operationId: getAnalyticsFunnelBySeller
      summary: Funil (Lead - MQL - SQL - Venda) fatiado por vendedor
      description: |
        Quebra do funil comercial **por vendedor** (dono do card em `crm_leads.assigned_to`),
        com contagem por etapa e taxas de conversao. Alias: `/analytics/sellers`.

        **Como cada numero e calculado**
        - `leads_created`: cards do vendedor criados dentro de [start_date, end_date)
        - `stage_counts[].count`: cards que ENTRARAM na etapa dentro da janela
          (primeira entrada registrada em `crm_lead_history.to_stage_id`)
        - `won` / `lost`: `crm_leads.status = won|lost` com `closed_at` dentro da janela
        - `avg_days_to_won`: media de dias entre `created_at` e `closed_at` dos ganhos
        - `sequential_rates`: taxa entre etapas adjacentes na ordem do pipeline

        **Atribuicao**: dono ATUAL do card (`attribution: current_owner`). Trocar o responsavel
        reatribui o historico do lead retroativamente — nao ha snapshot do dono por transicao.

        **Atencao a `stage_rates.lead_to_mql`**: o denominador sao os leads criados na janela,
        mas o numerador inclui cards criados antes que viraram MQL agora. Por isso a taxa pode
        passar de 100% em janelas curtas. Para conversao de coorte real use `/analytics/cohort`.
      tags: [Analytics]
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: start_date
          in: query
          schema: { type: string, format: date-time }
          description: Default = ultimos 30 dias
        - name: end_date
          in: query
          schema: { type: string, format: date-time }
          description: Default = agora
        - name: assigned_to
          in: query
          schema: { type: string, format: uuid }
          description: 'Filtra um unico vendedor (`profiles.id`). Alias: `seller_id`. Ausente = todos.'
      responses:
        '200':
          description: Funil por vendedor
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          period:
                            type: object
                            properties:
                              start_date: { type: string, format: date-time }
                              end_date: { type: string, format: date-time }
                          attribution:
                            type: string
                            example: current_owner
                          stages:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: string, format: uuid }
                                name: { type: string }
                                color: { type: string, nullable: true }
                                order: { type: integer }
                          stage_mapping:
                            type: object
                            description: Etapas detectadas por nome (prefixo MQL / SQL / Venda)
                            properties:
                              mql_stage_id: { type: string, format: uuid, nullable: true }
                              sql_stage_id: { type: string, format: uuid, nullable: true }
                              won_stage_id: { type: string, format: uuid, nullable: true }
                          sellers:
                            type: array
                            items:
                              type: object
                              properties:
                                seller:
                                  type: object
                                  properties:
                                    id: { type: string, format: uuid, nullable: true }
                                    name: { type: string, nullable: true }
                                    email: { type: string, nullable: true }
                                leads_created: { type: integer }
                                open: { type: integer }
                                won: { type: integer }
                                lost: { type: integer }
                                value_won: { type: number }
                                avg_days_to_won: { type: number, nullable: true }
                                stage_counts:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      stage_id: { type: string, format: uuid }
                                      stage_name: { type: string }
                                      order: { type: integer }
                                      count: { type: integer }
                                stage_rates:
                                  type: object
                                  description: Percentuais (0-100)
                                  properties:
                                    lead_to_mql: { type: number }
                                    mql_to_sql: { type: number }
                                    sql_to_won: { type: number }
                                    sql_to_won_stage: { type: number }
                                    win_rate: { type: number }
                                sequential_rates:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      from_stage_id: { type: string, format: uuid }
                                      from_stage_name: { type: string }
                                      to_stage_id: { type: string, format: uuid }
                                      to_stage_name: { type: string }
                                      rate: { type: number }
        '401':
          description: Nao autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

