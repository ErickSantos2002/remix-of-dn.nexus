    <!-- Critical inline CSS — paints background + textual skeleton immediately
         so the browser registers a real FCP on /schedule/:id without waiting
         for the JS chunk, the CSS chunk, or the Supabase data fetch. -->
    <style>
      html,body{margin:0;padding:0;background:#04070F;color:#F0F4FF;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
      #root{min-height:100vh}
      .nx-skel{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px}
      .nx-skel-wrap{width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:24px}
      .nx-skel-logo{height:42px;width:160px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.08),rgba(255,255,255,.04));border-radius:6px;animation:nx-pulse 1.4s ease-in-out infinite}
      .nx-skel-title{font-size:22px;line-height:1.25;font-weight:600;text-align:center;color:#FAFAF9;margin:8px 0 0;letter-spacing:-.01em}
      .nx-skel-sub{font-size:13px;color:#8C7A6E;text-align:center;margin:0}
      .nx-skel-card{width:100%;background:rgba(22,19,17,.6);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
      .nx-skel-row{height:14px;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.08),rgba(255,255,255,.04));animation:nx-pulse 1.4s ease-in-out infinite}
      .nx-skel-input{height:44px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
      .nx-skel-btn{height:44px;border-radius:8px;background:rgba(61,97,255,.35);margin-top:4px}
      @keyframes nx-pulse{0%,100%{opacity:.6}50%{opacity:1}}
      @media (min-width:640px){.nx-skel-title{font-size:28px}}
    </style>

    <!-- Route-aware head: skip Google Fonts on /schedule/:id (uses system-ui).
         For all other routes, load Sora/Space Mono non-blocking. -->
    <script>
      (function () {
        var isSchedule = /^\/schedule\//.test(window.location.pathname);
        if (!isSchedule) {
          var href = 'https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap';
          var pc1 = document.createElement('link'); pc1.rel='preconnect'; pc1.href='https://fonts.googleapis.com';
          var pc2 = document.createElement('link'); pc2.rel='preconnect'; pc2.href='https://fonts.gstatic.com'; pc2.crossOrigin='';
          var l = document.createElement('link'); l.rel='preload'; l.as='style'; l.href=href;
          l.onload = function(){ this.onload=null; this.rel='stylesheet'; };
          document.head.appendChild(pc1); document.head.appendChild(pc2); document.head.appendChild(l);
        }
      })();
    </script>

  <!-- Prefetch schedule-widget payload before React mounts on /schedule/:id.
       Resolved JSON is stored synchronously in __nexusScheduleData so the
       React page can hydrate without an extra fetch round-trip. -->
  <script>
    (function () {
      try {
        var m = window.location.pathname.match(/^\/schedule\/([^\/?#]+)/);
        if (!m) return;
        var widgetId = m[1];
        var now = new Date();
        var month = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
        var url = 'https://apbvnbubxyaihygnxdev.supabase.co/functions/v1/schedule-widget?widget_id=' + encodeURIComponent(widgetId) + '&month=' + month;
        var key = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwYnZuYnVieHlhaWh5Z254ZGV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwOTk4MDIsImV4cCI6MjA4MDY3NTgwMn0.vzLjyMKpGIucsgVsYzWryjNDjEYmItzwOdkuflpWg3M';
        var cacheKey = widgetId + '|' + month;
        var data = window.__nexusScheduleData = window.__nexusScheduleData || {};
        var pending = window.__nexusSchedulePrefetch = window.__nexusSchedulePrefetch || {};
        pending[cacheKey] = fetch(url, { headers: { apikey: key } })
          .then(function (r) { return r.json(); })
          .then(function (json) { data[cacheKey] = json; return json; })
          .catch(function () { return null; });
      } catch (e) { /* noop */ }
    })();
  </script>
